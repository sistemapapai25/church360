name: Build Android Release (AAB)

on:
  workflow_dispatch:
    inputs:
      publish_track:
        description: 'Faixa do Play Console para publicar (deixe vazio para só gerar o .aab sem publicar)'
        required: false
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'smoke_test'
          - 'internal'

env:
  ANDROID_PACKAGE_NAME: com.papai.myapp
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/612780695986/locations/global/workloadIdentityPools/github/providers/church360
  GCP_SERVICE_ACCOUNT: id-play-publisher@church360-494119.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode release keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_STORE_PASSWORD
          keyPassword=$ANDROID_KEYSTORE_KEY_PASSWORD
          keyAlias=$ANDROID_KEYSTORE_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
        env:
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}

      - name: Build App Bundle
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
        run: |
          flutter build appbundle --release \
            --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY \
            --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID \
            --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID \
            --dart-define=FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET \
            --dart-define=FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Setup Python
        if: ${{ inputs.publish_track != 'none' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Play Publisher dependencies
        if: ${{ inputs.publish_track != 'none' }}
        run: pip install --quiet google-api-python-client google-auth

      - name: Authenticate to Google Cloud (OIDC)
        if: ${{ inputs.publish_track != 'none' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Publish to Google Play
        if: ${{ inputs.publish_track != 'none' }}
        env:
          PLAY_TRACK: ${{ inputs.publish_track }}
        run: python .github/scripts/publish_to_play.py
