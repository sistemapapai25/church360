name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'

      - name: Install dependencies
        run: flutter pub get

      # LINK-02: a config da Vercel deixou de ser gerada aqui. Ela agora e versionada em
      # `web/vercel.json` e o `flutter build web` a copia para `build/web/vercel.json`,
      # que e exatamente de onde o deploy roda. Reintroduzir um passo que escreva
      # `build/web/vercel.json` apaga os headers de Content-Type dos arquivos de
      # `.well-known/` e quebra a verificacao de dominio do App Link / Universal Link.
      - name: Build Flutter Web
        run: flutter build web --release

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --token=$VERCEL_TOKEN
