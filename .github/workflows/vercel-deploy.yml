name: Deploy Flutter Web to Vercel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          flutter build web --release             --dart-define=FIREBASE_VAPID_KEY=$FIREBASE_VAPID_KEY \
            --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY \
            --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID \
            --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID \
            --dart-define=FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET \
            --dart-define=FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN             --dart-define=APP_VERSION=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}

          # Service worker do push web: precisa estar na raiz do site com a
          # config do Firebase (pública). Ele mostra a notificação com a aba
          # fechada e, no clique, abre o link (rota) que o send-push manda.
          cat > build/web/firebase-messaging-sw.js << EOF
          importScripts('https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js');
          importScripts('https://www.gstatic.com/firebasejs/11.9.1/firebase-messaging-compat.js');
          firebase.initializeApp({
            apiKey: '$FIREBASE_API_KEY',
            appId: '$FIREBASE_APP_ID',
            messagingSenderId: '$FIREBASE_MESSAGING_SENDER_ID',
            projectId: '$FIREBASE_PROJECT_ID',
          });
          firebase.messaging();
          EOF

      - name: Write Vercel rewrites config
        run: |
          cat > build/web/vercel.json << 'EOF'
          {
            "rewrites": [
              { "source": "/privacidade", "destination": "/privacy.html" },
              { "source": "/privacy", "destination": "/privacy.html" },
              { "source": "/termos", "destination": "/terms.html" },
              { "source": "/terms", "destination": "/terms.html" },
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        working-directory: build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --yes --token=$VERCEL_TOKEN
