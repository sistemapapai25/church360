name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.3'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Debug repository files
        run: |
          pwd
          ls -lah
          echo "---- firebase.json ----"
          cat firebase.json
          echo "---- build/web ----"
          ls -lah build/web
          echo "---- index.html title ----"
          grep -i "<title>" build/web/index.html || true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13.0.0

      - name: Show Firebase CLI version
        run: firebase --version

      - name: Check Hosting sites access
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:sites:list --project church360-15887238

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project church360-15887238 --debug